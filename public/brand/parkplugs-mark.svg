<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="ParkPlugs">
  <!--
    Placeholder mark: pure-black ground, chrome "P" with an electric-blue
    core, a top-down car silhouette, and cyan sonar rings underneath. Swap
    this file for the final artwork later — nothing else needs to change.
  -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="#04070C" stroke="#16283A" stroke-width="2" />

  <!-- Chrome "P" bowl + stem -->
  <rect x="24" y="20" width="16" height="52" rx="7" fill="#C8D4E0" />
  <rect x="24" y="20" width="40" height="30" rx="15" fill="#C8D4E0" />
  <rect x="24" y="20" width="40" height="30" rx="15" fill="url(#chromeGradient)" opacity="0.55" />
  <rect x="38" y="29" width="16" height="12" rx="6" fill="#04070C" />
  <circle cx="46" cy="35" r="4" fill="#0A84FF" />

  <!-- Top-down car silhouette -->
  <rect x="60" y="46" width="22" height="34" rx="7" fill="#0A84FF" />
  <rect x="64" y="52" width="14" height="8" rx="2" fill="#04070C" opacity="0.55" />
  <rect x="64" y="66" width="14" height="8" rx="2" fill="#04070C" opacity="0.55" />

  <!-- Sonar / radar rings under the car -->
  <circle cx="71" cy="86" r="14" fill="none" stroke="#22D3EE" stroke-width="2" opacity="0.85" />
  <circle cx="71" cy="86" r="20" fill="none" stroke="#22D3EE" stroke-width="1.5" opacity="0.5" />
  <circle cx="71" cy="86" r="26" fill="none" stroke="#22D3EE" stroke-width="1" opacity="0.28" />

  <defs>
    <linearGradient id="chromeGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4F7FA" />
      <stop offset="50%" stop-color="#9BA8B8" />
      <stop offset="100%" stop-color="#C8D4E0" />
    </linearGradient>
  </defs>
</svg>
